name: BizPrice
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  provider: ^6.1.5+1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/LogoApp/logoApp.jpeg
    - assets/images/logo.png   # ✅ HARUS 2 spasi dari "flutter"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/LogoApp/logoApp.jpeg"